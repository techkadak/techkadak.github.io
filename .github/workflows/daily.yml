# Tech Kadak — roz 5 naye apps + website deploy (100% free on GitHub).
# Kab chalta hai: roz 03:30 UTC (= 9:00 AM IST), jab bhi tum files badlo (push), aur "Run workflow" button se.
name: Daily app + deploy

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: pages
        uses: actions/configure-pages@v6
      - name: Aaj ke 5 apps add karo (sirf daily / manual run pe)
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/daily.mjs
      - name: Website pages banao (SEO pages, sitemap, feed)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build.mjs
      - name: Tests
        run: node --test test/site.test.mjs
      - name: Changes save karo (commit)
        run: |
          git config user.name "techkadak-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Kuch naya nahi"; else git commit -m "Aaj ka app + site update $(date -u +%F)" && git push; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
